<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SyncLab preview</title>
<link rel="stylesheet" href="build/obsidian-app.css">
<link rel="stylesheet" href="build/styles.css">
<style>
	:root { --preview-sidebar: 380px; --font-interface: system-ui, "Segoe UI", sans-serif; --font-monospace: ui-monospace, "Cascadia Code", Consolas, monospace; }
	html { overflow: auto !important; height: auto !important; }
	body { overflow: visible !important; height: auto !important; contain: none !important; }
	body { margin: 0; padding: 16px; font-family: var(--font-interface); background: #e9e6df; color: #222; }
	body.theme-dark { background: #101012; color: #ddd; }
	.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; font: 600 13px var(--font-interface); }
	.toolbar button { border: 2px solid currentColor; background: transparent; color: inherit; border-radius: 999px; padding: 4px 12px; font: inherit; cursor: pointer; }
	.frame { display: grid; grid-template-columns: minmax(0, 1fr) var(--preview-sidebar); height: 900px; border: 1px solid #c9c4b8; border-radius: 10px; overflow: hidden; background: #fff; }
	.theme-dark .frame { background: #1e1e1e; border-color: #333; }
	.editor { padding: 36px 40px; font-size: 15px; line-height: 1.7; color: #333; border-right: 1px solid #ddd; overflow: auto; }
	.theme-dark .editor { color: #ccc; border-color: #333; }
	.workspace-leaf-content { min-width: 0; height: 100%; }
	.view-content { height: 100%; overflow: auto; }
	.preview-full .frame { height: auto; }
	.preview-full .view-content { overflow: visible; }
	.preview-full #modal-layer { position: static; min-height: 100vh; }
	.preview-wizard .frame { display: none; }
	.preview-wizard #modal-layer { background: transparent; place-items: start center; }
	.showcase { display: flex; gap: 28px; align-items: flex-start; }
	.showcase[hidden] { display: none; }
	.showcase-pane { width: 380px; border-radius: 18px; overflow: hidden; border: 1px solid rgba(0, 0, 0, 0.18); box-shadow: 0 12px 32px rgba(0, 0, 0, 0.14); }
	body.preview-showcase { padding: 28px; background: #e9e6df; }
	.preview-showcase .toolbar, .preview-showcase .frame { display: none; }
	#modal-layer { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); display: grid; place-items: center; padding: 16px; overflow: auto; }
	#modal-layer[hidden] { display: none; }
	@media (max-width: 760px) { .frame { grid-template-columns: minmax(0, 1fr); } .editor { display: none; } }
</style>
</head>
<body class="theme-light">
	<div class="toolbar">
		<span>Theme</span><button data-theme="light">Light</button><button data-theme="dark">Dark</button>
		<span>Width</span><button data-width="300">300</button><button data-width="380">380</button><button data-width="460">460</button>
		<button id="show-wizard">Setup wizard</button><button id="show-welcome">Toggle connected</button><button id="reset">Reset</button>
	</div>
	<div class="frame">
		<div class="editor"><h1>2026-10-04</h1><p>Sketched the SyncLab sidebar. One button, no surprises.</p></div>
		<div class="workspace-leaf-content"><div class="view-content synclab synclab-host" id="sidebar"></div></div>
	</div>
	<div class="showcase" id="showcase" hidden>
		<div class="showcase-pane theme-light"><div class="synclab synclab-host"></div></div>
		<div class="showcase-pane theme-dark"><div class="synclab synclab-host"></div></div>
	</div>
	<div id="modal-layer" hidden><div class="modal synclab synclab-modal"><div class="modal-content" id="modal"></div></div></div>
	<script type="module" src="build/preview.js"></script>
</body>
</html>
